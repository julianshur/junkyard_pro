<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Junkyard Profit Finder</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="search-panel">
      <div>
        <p class="eyebrow">SoCal Self-Service Junkyards</p>
        <h1>Junkyard Profit Finder</h1>
        <p class="lede">Find cars at nearby Pick Your Part yards and see what their parts sell for on eBay.</p>
      </div>
      <form id="search-form" class="search-form">
        <label for="location">Search by yard name or city</label>
        <div class="input-row">
          <input id="location" type="text" placeholder="e.g. Sun Valley, Wilmington, Anaheim…" autocomplete="off" required />
          <button type="submit">Search</button>
        </div>
      </form>
    </div>

    <div id="status" class="status-band" hidden></div>

    <div id="summary" class="summary-grid" hidden>
      <article>
        <span>Yard</span>
        <strong id="yard-name">—</strong>
        <a id="yard-link" href="#" target="_blank" rel="noreferrer">Open full inventory ↗</a>
      </article>
      <article>
        <span>Vehicles in yard</span>
        <strong id="car-count">—</strong>
      </article>
      <article>
        <span>eBay comps loaded</span>
        <strong id="comp-count">—</strong>
      </article>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script src="/app.js?v=3"></script>
</body>
</html>
